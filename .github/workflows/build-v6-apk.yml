name: Build RoboSoccer ESP32 RC Wokwi Lab V6 APK

on:
  push:
    branches: [main]
    paths:
      - 'source/v6/chunks/**'
      - '.github/workflows/build-v6-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v6-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V5 repository with V6 source archive
        uses: actions/checkout@v4

      - name: Reconstruct and validate V6 source
        shell: bash
        run: |
          set -euo pipefail
          cat source/v6/chunks/part-*.bin > /tmp/esp32-rc-wokwi-v6.tar.xz
          xz -t /tmp/esp32-rc-wokwi-v6.tar.xz
          tar -xJf /tmp/esp32-rc-wokwi-v6.tar.xz -C .
          test -f esp32_rc_wokwi_lab_android/package.json
          test -f esp32_rc_wokwi_lab_android/www/index.html
          test -f esp32_rc_wokwi_lab_android/android_native/MainActivity.java
          echo "V6 source archive reconstructed and validated."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Arduino CLI and compile built-in ESP32 presets
        working-directory: esp32_rc_wokwi_lab_android
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          python3 scripts/build_preset_bins.py

      - name: Install Capacitor and configure native USB-OTG serial
        working-directory: esp32_rc_wokwi_lab_android
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npx cap add android
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/esp32rc/wokwilab
          cp usb_otg/device_filter.xml android/app/src/main/res/xml/device_filter.xml
          cp android_native/UsbSerialBridge.java android/app/src/main/java/com/esp32rc/wokwilab/UsbSerialBridge.java
          cp android_native/MainActivity.java android/app/src/main/java/com/esp32rc/wokwilab/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          bg_path = Path('android/build.gradle')
          bg = bg_path.read_text()
          if 'jitpack.io' not in bg:
              bg = bg.replace('mavenCentral()', 'mavenCentral()\n        maven { url "https://jitpack.io" }')
              bg_path.write_text(bg)

          app_gradle_path = Path('android/app/build.gradle')
          app_gradle = app_gradle_path.read_text()
          if 'usb-serial-for-android' not in app_gradle:
              app_gradle = app_gradle.replace(
                  'dependencies {',
                  'dependencies {\n    implementation "com.github.mik3y:usb-serial-for-android:3.8.0"'
              )
              app_gradle_path.write_text(app_gradle)

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          if 'android.hardware.usb.host' not in manifest:
              manifest = manifest.replace(
                  '<application',
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application',
                  1
              )
              manifest_path.write_text(manifest)
          PY

          npx cap sync android

      - name: Build Android debug APK
        working-directory: esp32_rc_wokwi_lab_android/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload V6 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_RC_Wokwi_Lab-V6-Android-APK
          path: esp32_rc_wokwi_lab_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
